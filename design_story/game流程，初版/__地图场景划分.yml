第一章:
  # 森林
  初始之森林:
    NPC对战
    密道 + 宝箱
    剧情笔记一
    魔力水晶一
    路边精灵
    主分叉路，关底BOSS： 凶颅恶狼
    不起眼分岔路，进入下一个场景
  溪流森林:
    开启主线：《抓捕4只精灵》。
    精灵栖息地，水系+草系+密道里的火系
    无道路，只剩下击败凶颅恶狼，击败后，解锁下一个场景
  湖泊:
    继续走，脚底一片很浅的湖泊，栖息着很多精灵，可跳下去游动。
    湖泊尽头，魔力水晶二
    商人出现，贩卖水下潜水装备。
    继续走，到达下一个场景。
  湖泊附近森林:
    跳跳乐后来到水潭，底部藏着地下水区域。
    地下水区域:
      熔岩鱼
    不潜水，继续走，附近出现帐篷，
    帐篷:
      内有3个NPC，进行对战。
      Npc说森林里有污染，开启主线：《搜寻污染根源》
    继续走，进入下一个场景
  山地森林:
    严格跳跳乐，玩家无法失误，因为底部有毒水。
    通过后，解锁魔力水晶三，
    商人刷新，贩卖二段跳。
    森林栖息地，但是有攻击人的精灵。
    通过后，路边Npc出现，说：你不该来这，太危险了。触发Npc对战
    接下来就出现分叉路，其中一个分叉路，前往主线矿洞门口：
  山地矿口:
    走着就会来到矿口，
    门口有Npc守着，很强，玩家打不过的。
    玩家只能先前往另外一个分叉路：森林秘境
  森林秘境:
    精灵栖息地，
    深入后，魔力水晶四，商人也在附近。
    继续走，进入秘境二
  森林秘境二:
    很多跳跳乐，
    道具：生命值永久+1，这样玩家有3颗Heart。
    发现水潭，内部是地下河区域。
    地下河区域:
      钢牙鲨，
      击败后进入深水神殿。
    深水神殿:
      深渊水灵
      鱼龙王的蛋
    探索后，进入森林秘境三
  森林秘境三:
    是BOSS：森林巨人
    打完没路了，玩家应该已经准备好进入矿洞了。
    玩家打赢矿口Npc解锁进入矿洞的条件。
  山内矿洞一:
    跳跳乐，夹杂着攻击人的精灵。
    获取点金币、宝箱、爱心，进入下一个场景
  山内矿洞二:
    解锁魔力水晶五
    继续向前，触发Boss战。
    章节Boss：老赵+他的弟子。
  
